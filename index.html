<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="robots" content="noindex, nofollow" />
		<meta name="theme-color" content="#2563eb" />
		<title>Maintenance | DocuMind</title>
		<link
			rel="icon"
			href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='4' y='2' width='16' height='20' rx='3' fill='%232563eb'/%3E%3Cpath d='M8 8h8M8 12h8M8 16h5' stroke='white' stroke-width='1.8' stroke-linecap='round'/%3E%3C/svg%3E" />

		<!-- Fonts are optional: system fonts take over if they fail to load. -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Righteous&display=swap" rel="stylesheet" />

		<style>
			:root {
				--primary: #2563eb;
				--primary-hover: #1d4ed8;
				--primary-soft: #dbeafe;
				--ink: #10213f;
				--ink-sub: #4b5b78;
				--ink-light: #66758f;
				--line: #e3eaf6;
				--bg: #f3f7fe;
				--card: #ffffff;
				--amber: #f59e0b;

				--font-body: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
				--font-brand: "Righteous", "Poppins", -apple-system, "Segoe UI", sans-serif;
			}

			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				font-family: var(--font-body);
				color: var(--ink);
				display: flex;
				min-height: 100vh;
				min-height: 100dvh;
				padding: clamp(10px, 3vw, 20px);
				background-color: var(--bg);
				/* soft dot grid, fading out toward the edges */
				background-image: radial-gradient(ellipse at center, transparent 30%, var(--bg) 78%), radial-gradient(circle, #c9d8f3 1.2px, transparent 1.4px);
				background-size:
					100% 100%,
					22px 22px;
			}

			.card {
				width: 100%;
				max-width: 540px;
				margin: auto;
				background: var(--card);
				border-radius: clamp(20px, 4vw, 28px);
				padding: clamp(20px, 5vh, 40px) clamp(20px, 5vw, 40px) clamp(16px, 3vh, 24px);
				text-align: center;
				border: 1px solid var(--line);
				box-shadow:
					0 1px 2px rgba(16, 33, 63, 0.04),
					0 12px 32px -8px rgba(37, 99, 235, 0.14),
					0 32px 64px -24px rgba(16, 33, 63, 0.12);
			}

			.brand {
				font-family: var(--font-brand);
				font-size: clamp(1.1rem, 3.5vw, 1.3rem);
				letter-spacing: 2px;
				text-transform: uppercase;
				color: var(--primary);
				line-height: 1;
				margin-bottom: clamp(10px, 2.5vh, 20px);
			}

			.art {
				width: clamp(84px, 17vh, 120px);
				height: auto;
				display: block;
				margin: 0 auto clamp(8px, 2vh, 16px);
				overflow: visible;
			}

			.gear {
				transform-box: fill-box;
				transform-origin: center;
				animation: turn 10s linear infinite;
			}

			@keyframes turn {
				to {
					transform: rotate(360deg);
				}
			}

			h1 {
				font-weight: 600;
				font-size: clamp(1.3rem, 4.2vw, 1.65rem);
				line-height: 1.2;
				letter-spacing: -0.01em;
				margin-bottom: 8px;
				text-wrap: balance;
			}

			.lead {
				font-size: clamp(0.85rem, 2.4vw, 0.95rem);
				line-height: 1.55;
				color: var(--ink-sub);
				max-width: 38ch;
				margin: 0 auto;
				text-wrap: pretty;
			}

			.safe {
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 10px;
				margin: clamp(12px, 2.5vh, 20px) auto 0;
				padding: 10px 14px;
				max-width: 420px;
				background: #eef4ff;
				border-radius: 14px;
				font-size: 0.875rem;
				line-height: 1.45;
				color: var(--ink);
				text-align: left;
			}

			.safe svg {
				flex: none;
				width: 20px;
				height: 20px;
				fill: none;
				stroke: var(--primary);
				stroke-width: 2;
				stroke-linecap: round;
				stroke-linejoin: round;
			}

			.status {
				display: flex;
				flex-wrap: wrap;
				align-items: center;
				justify-content: center;
				gap: 6px 18px;
				margin-top: clamp(14px, 3vh, 22px);
				padding-top: 14px;
				border-top: 1px solid var(--line);
				font-size: 0.8125rem;
				color: var(--ink-light);
			}

			.status .dot {
				display: inline-block;
				width: 8px;
				height: 8px;
				margin-right: 8px;
				border-radius: 50%;
				background: var(--amber);
			}

			.link-btn:focus-visible {
				outline: 3px solid rgba(37, 99, 235, 0.35);
				outline-offset: 3px;
			}

			.link-btn {
				background: none;
				border: none;
				padding: 0;
				font: inherit;
				color: var(--primary-hover);
				text-decoration: underline;
				text-underline-offset: 3px;
				cursor: pointer;
			}

			/* very short screens: drop the illustration so nothing scrolls */
			@media (max-height: 560px) {
				.art {
					display: none;
				}
			}

			@media (prefers-reduced-motion: reduce) {
				.gear {
					animation: none;
				}
			}
		</style>
	</head>

	<body>
		<main class="card">
			<div class="brand">DocuMind</div>

			<svg class="art" viewBox="0 0 160 130" aria-hidden="true">
				<!-- back page -->
				<rect x="34" y="10" width="78" height="100" rx="10" fill="#dbeafe" transform="rotate(-8 73 60)" />
				<!-- front page -->
				<rect x="44" y="14" width="78" height="100" rx="10" fill="#fff" stroke="#c7d7f5" stroke-width="2" />
				<rect x="56" y="28" width="30" height="8" rx="4" fill="#2563eb" />
				<rect x="56" y="48" width="54" height="6" rx="3" fill="#dbeafe" />
				<rect x="56" y="62" width="54" height="6" rx="3" fill="#dbeafe" />
				<rect x="56" y="76" width="36" height="6" rx="3" fill="#dbeafe" />
				<!-- gear badge -->
				<circle cx="116" cy="94" r="24" fill="#2563eb" stroke="#fff" stroke-width="4" />
				<g transform="translate(103 81) scale(1.08)">
					<g class="gear" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
						<circle cx="12" cy="12" r="3" />
						<path
							d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
					</g>
				</g>
			</svg>

			<h1>DocuMind is down for maintenance</h1>
			<p class="lead">We expect to be back in a few days. There's no exact time yet, so no need to keep refreshing.</p>

			<p class="safe">
				<svg viewBox="0 0 24 24" aria-hidden="true">
					<path d="M12 3l8 3v6c0 4.5-3.2 8.2-8 9-4.8-.8-8-4.5-8-9V6l8-3z" />
					<path d="M9 12l2 2 4-4" />
				</svg>
				<span>Your documents are safe and will be available when we're back.</span>
			</p>

			<div class="status">
				<span><span aria-hidden="true"></span>Maintenance started: Nov. 1, 2026</span> •
				<button type="button" class="link-btn" onclick="location.reload()">Reload page</button>
			</div>
		</main>
	</body>
</html>
